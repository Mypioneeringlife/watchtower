name: Highlander Watch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/highlander_entities.json'
      - 'watcher/**'
      - '.github/workflows/highlander-watch.yml'
  schedule:
    - cron: '37 2,8,14,20 * * *'
    - cron: '17 15 * * *'

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Highlander Watch tests
        run: python -m unittest watcher.tests.test_highlander_watch

      - name: Refresh Highlander roster when appropriate
        shell: bash
        run: |
          refresh=false
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            refresh=true
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 15 * * *" ] && [ "$(date -u +%u)" = "7" ]; then
            refresh=true
          fi
          if [ "$refresh" = "true" ]; then
            python watcher/highlander_roster.py || echo "Roster refresh failed; continuing with the existing verified roster."
          else
            echo "Roster refresh not due on this run."
          fi

      - name: Run Highlander Watch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python watcher/highlander_watcher.py --once --scope all
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 15 * * *" ]; then
            python watcher/highlander_watcher.py --once --scope all
          else
            python watcher/highlander_watcher.py --once --scope core
          fi

      - name: Commit Highlander Watch output
        run: |
          git config user.name "watchtower-bot"
          git config user.email "watchtower-bot@users.noreply.github.com"
          git add data/highlander_entities.json data/highlander-events.json data/highlander-seen.json data/highlander-state.json data/highlander-run-log.json outbox/second-brain || true
          if git diff --cached --quiet; then
            echo "No Highlander Watch changes."
          else
            git commit -m "Update Highlander Watch intelligence"
            git push
          fi
